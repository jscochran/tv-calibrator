      <li class="${stage === 1 ? "now" : "done"}"><b>Measure the greys as they are.</b> Click Measure, then play <b>${esc(f.file)}</b> on the TV.
        ${stage === 1 ? `<div><button class="primary" id="f-base">Measure (about 2½ minutes)</button></div>` : " ✓"}</li>
      <li class="${stage === 2 ? "now" : ""}"><b>Nudge four controls</b> in the multipoint menu, exactly as listed:
        <table class="cktable" style="max-width:420px"><tbody>${nudgeRows}</tbody></table></li>
      <li class="${stage === 2 ? "now" : ""}"><b>Measure again</b> with the same video. The app compares the two and finds each control.
        ${stage === 2 ? `<div><button class="primary" id="f-nudged">I've made the four changes - measure</button></div>` : ""}</li>
    </ol>
    <div id="fbody"></div>
    <div class="stagefoot"><button class="secondary" id="f-skip">Skip: fine-tune without it</button></div>`;
  $("#f-grid").onchange = async () => { await api("/api/tv/settings", { name: S.tv, points: +$("#f-grid").value }); loadGuide(); };
  const go = async phase => {
    const r = await api("/api/finder/measure", { name: S.tv, mode: S.mode, phase });
    if (r.error) return alert(r.error);
    pollFinder(phase);
  };
  if ($("#f-base")) $("#f-base").onclick = () => go("base");
  if ($("#f-nudged")) $("#f-nudged").onclick = () => go("nudged");
  $("#f-skip").onclick = () => { S.guide.finder.map = [{ point: 0, level: 0 }]; stepFineManual(); };
}
const finderGrid = () => (+(tvCfg().points || 20) === 20 ? 5 : 10);
function stepFineManual() {
  const fine = S.guide.plan.fine, names = S.guide.names, p = getProg();
  const cur = p.finePid || fine[0];
  stepWB("fine", cur, "Fine-tune: one grey at a time");
  $(".stagehead").insertAdjacentHTML("beforeend", `<div class="chips">${fine.map(pid => `<button class="chip ${pid === cur ? "on" : ""}" data-fine="${pid}">${esc(nice(names[pid]))}</button>`).join("")}</div>
    <p class="hint" style="margin-top:10px">If the bars don't move, try the control one step lower or higher.</p>`);
  document.querySelectorAll("[data-fine]").forEach(b => b.onclick = () => { const q = getProg(); q.finePid = b.dataset.fine; setProg(q); stepFineManual(); });
}
function pollFinder(phase) {
  stopGuideLive();
  S.gpoll = setInterval(async () => {
    const j = await api("/api/job");
    const body = $("#fbody"); if (!body) return stopGuideLive();
    if (["done", "error", "cancelled"].includes(j.phase)) {
      stopGuideLive();
      if (j.phase !== "done") { body.innerHTML = `<p class="errline">${esc(j.error || "Cancelled.")}</p>`; return; }
      S.guide = await api(`/api/guide?name=${encodeURIComponent(S.tv)}&mode=${S.mode}`);
      if (phase === "base") return stepFinder();
      return showFinderResult();
    }
    if (j.phase === "waiting" || j.phase === "starting") {
      const y = j.readings && j.readings.length ? j.readings[j.readings.length - 1].Y : null;
      body.innerHTML = `<div class="measuring"><div class="nowplay"><span>Play on the TV</span><b>${esc(S.guide.finder.file)}</b><small>from the start</small></div>
        ${meterLine(j)}<p>Waiting for the video's flashes…</p><button class="linkbtn" id="f-cancel">Cancel</button></div>`;
    } else {
      body.innerHTML = `<div class="measuring">${meterLine(j)}<p>Measuring <b>${esc(nice((j.patches[j.index] || {}).name || ""))}</b> · ${j.patches.filter(p => p.done).length} of ${j.patches.length}</p>${strip(j)}<button class="linkbtn" id="f-cancel">Cancel</button></div>`;
    }
    if ($("#f-cancel")) $("#f-cancel").onclick = () => api("/api/round/cancel", {});
  }, 600);
}
function showFinderResult() {
  const f = S.guide.finder;
  $("#stage").innerHTML = `
    <div class="stagehead"><h2>Found them</h2><p>Here's where your TV's controls really act. The fine-tune step will now point you to the right one for each grey.</p></div>
    <table class="cktable"><thead><tr><th>TV control</th><th>Moves the grey at</th><th>Shift</th></tr></thead><tbody>
      ${f.map.map(m => `<tr><td>${m.point}%</td><td>${fmt(m.level, 0)}%</td><td class="${Math.abs(m.level - m.point) >= 5 ? "warn" : "good"}">${m.level - m.point > 0 ? "+" : ""}${fmt(m.level - m.point, 0)}</td></tr>`).join("")}
    </tbody></table>
    <div class="nowplay" style="margin-top:18px"><span>Now put them back</span><b>Set those four controls back to where they were (−10 each)</b><small>before fine-tuning</small></div>
    <div class="stagefoot"><button class="primary" id="f-done">I've put them back - fine-tune</button></div>`;
  $("#f-done").onclick = () => renderGuide();
}

/* ---------- 6. colours, one at a time, live */
function stepColours() {
  const p = getProg(), cols = S.guide.colours, cfg = tvCfg(), b = brandOf();
  const cur = p.colour || cols[0];
  const haveWhite = !!lastSession();
  $("#stage").innerHTML = `
    <div class="stagehead"><h2>Colours: ${COLOUR_NAMES[cur]}</h2>
      <p>${cfg.cms === "off" ? "This TV has no colour controls set up here - you can just check the colours, or choose its colour menu type at the top." :
          cfg.cms === "samsung" ? "Use the colour's own Red, Green and Blue sliders." : "Use the colour's Hue (some TVs call it Tint), Saturation and Brightness (or Luminance) sliders."}
      <span class="where">Where: ${esc(b.cms)}</span></p>
      <div class="chips">${cols.map(c => `<button class="chip ${c === cur ? "on" : ""} ${p.colours.includes(c) ? "done" : ""}" data-col="${c}">
        <i class="sw" style="background:${COLOUR_SW[c]}"></i>${COLOUR_NAMES[c]}${p.colours.includes(c) ? ((p.limits || []).includes(c) ? " · at its limit" : " ✓") : ""}</button>`).join("")}</div></div>
    ${haveWhite ? "" : '<p class="warn">Run the Before check first, so brightness can be judged against this TV\'s own white.</p>'}
    ${playBanner(cur)}
    <div class="live2" id="live"><p class="hint">${videoMode() ? "Start the file above on the TV; the readings appear as soon as the meter sees it." : "Putting the colour on the TV…"}</p></div>
    <div class="stagefoot"><button class="secondary" id="c-skip">Skip this colour</button>
      <button class="secondary" id="c-limit" title="The sliders are maxed out and it won't get closer - the panel's limit">Can't get closer - mark done</button>
      <button class="primary" id="c-next" disabled>Waiting for the meter…</button></div>`;
  document.querySelectorAll("[data-col]").forEach(btn => btn.onclick = () => { const q = getProg(); q.colour = btn.dataset.col; setProg(q); renderGuide(); });
  const advance = done => {
    const q = getProg();
    if (done && !q.colours.includes(cur)) q.colours.push(cur);
    const rest = cols.filter(c => !q.colours.includes(c) && c !== cur);
    if (rest.length) { q.colour = rest[0]; setProg(q); renderGuide(); }
    else { q.colour = null; setProg(q); goStep("after", "colours"); }
  };
  $("#c-skip").onclick = () => advance(false);
  $("#c-limit").onclick = () => { const q = getProg(); q.limits = q.limits || []; if (!q.limits.includes(cur)) q.limits.push(cur); setProg(q); advance(true); };
  $("#c-next").onclick = () => advance(true);
  startLive(cur, d => renderColourLive(d, cur));
}
function hslTips(d, name) {
  const t = [];
  if (Math.abs(d.hue) >= 2) t.push(`<li><b>Hue / Tint</b> — ${name} leans toward ${COLOUR_NAMES[d.toward] || "a neighbour"}. Move it one click and keep going the way that shrinks the Hue bar.</li>`);
  if (Math.abs(d.sat) >= 3) t.push(`<li><b>${d.sat > 0 ? "Lower" : "Raise"} Saturation</b> — ${name} is ${fmt(Math.abs(d.sat), 0)}% too ${d.sat > 0 ? "strong" : "weak"}.</li>`);
  if (d.lum != null && Math.abs(d.lum) >= 5) t.push(`<li><b>${d.lum > 0 ? "Lower" : "Raise"} Brightness</b> (Luminance) — ${fmt(Math.abs(d.lum), 0)}% too ${d.lum > 0 ? "bright" : "dim"}.</li>`);
  return t;
}
function rgbTips(d, name) {
  if (!d.rgb_hint) return [`<li>Run the Before check first: the Red/Green/Blue hints need this TV's white as a reference.</li>`];
  const NAMES = ["Red", "Green", "Blue"], oor = d.out_of_reach;
  const stuck = oor ? oor.channels.map(c => "RGB".indexOf(c)) : [];
  const order = [0, 1, 2].filter(j => !stuck.includes(j)).sort((a, b) => Math.abs(d.rgb_hint[b]) - Math.abs(d.rgb_hint[a]));
  const t = order.filter(j => Math.abs(d.rgb_hint[j]) > 0.03).slice(0, 2).map(j =>
    `<li><b>${d.rgb_hint[j] > 0 ? "Raise" : "Lower"} the ${NAMES[j]} slider</b> for ${name}. A couple of clicks at a time.</li>`);
  if (oor) t.push(`<li class="limit"><b>Out of reach:</b> to match exactly, ${name} would need ${stuck.map(j => NAMES[j]).join(" and ")} below zero.
    ${name} sits beyond what this TV's ${[0, 1, 2].filter(j => !stuck.includes(j)).map(j => NAMES[j].toLowerCase()).join(" and ")} can mix as they are now, so that slider stops helping once it reaches zero.
    The best this colour can get is about <b>dE ${fmt(oor.best_de, 1)}</b>. When you're there, use <b>Can't get closer</b>.</li>`);
  return t;
}
function rangeBar(label, v, span, unit) {
  if (v == null) return `<div class="bbar"><span>${label}</span><div class="track"></div><b class="hint">–</b></div>`;
  const off = clamp(v / span * 50, -50, 50);
  return `<div class="bbar"><span>${label}</span><div class="track"><div class="fill" style="background:var(--white);left:${off < 0 ? 50 + off : 50}%;width:${Math.abs(off)}%"></div></div>
    <b>${v > 0 ? "+" : ""}${fmt(v)}${unit}</b></div>`;
}
function renderColourLive(d, cur) {
  const live = $("#live"); if (!live) return;
  if (d.mismatch) { live.innerHTML = mismatchBox(d); const nb = $("#c-next"); if (nb) { nb.disabled = true; nb.textContent = "Waiting for the right pattern…"; } return; }
  const name = COLOUR_NAMES[cur], cfg = tvCfg(), rgbMenu = cfg.cms === "samsung";
  const sliderBar = (label, v, colour) => {
    if (v == null) return `<div class="bbar"><span style="color:${colour}">${label}</span><div class="track"></div><b class="hint">–</b></div>`;
    const off = clamp(v * 250, -50, 50);    // ±20% fills the bar
    return `<div class="bbar"><span style="color:${colour}">${label}</span><div class="track"><div class="fill" style="background:${colour};left:${off < 0 ? 50 + off : 50}%;width:${Math.abs(off)}%"></div><i class="tol"></i></div>
      <b class="${Math.abs(v) <= 0.03 ? "good" : ""}">${Math.abs(v) <= 0.03 ? "OK" : (v > 0 ? "raise" : "lower")}</b></div>`;
  };
  const h = (d.rgb_hint || [null, null, null]).map((v, j) => d.out_of_reach && d.out_of_reach.channels.includes("RGB"[j]) ? null : v);
  const bars = rgbMenu
    ? `${sliderBar("Red slider", h[0], "var(--r)")}${sliderBar("Green slider", h[1], "var(--g)")}${sliderBar("Blue slider", h[2], "var(--b)")}
       <p class="hint" style="margin:-4px 0 14px">The bars show which of ${name}'s own sliders to move${d.rgb_approx ? " (estimated: the Before check didn't get all three primaries)" : ""}. dE ${fmt(d.de, 2)}; under 2 is the goal.</p>`
    : `${rangeBar("Hue / Tint", d.hue, 10, "°")}${rangeBar("Saturation", d.sat, 15, "%")}${rangeBar("Brightness", d.lum, 25, "%")}
       <p class="hint" style="margin:-4px 0 14px">dE ${fmt(d.de, 2)}; under 2 is the goal.</p>`;
  const tips = d.steady ? [`<li class="done">${name} is on target. Nice.</li>`] :
    (cfg.cms === "off" ? [] : cfg.cms === "samsung" ? rgbTips(d, name) : hslTips(d, name));
  live.innerHTML = `
    <figure class="hero">${liveGamut(d, cur)}<figcaption>Ring: where ${name} should be. Dot: where it is now.</figcaption></figure>
    <div class="side">
      ${bars}${avgLine(d)}
      <ul class="tips">${tips.join("") || (d.ok ? `<li class="ok">Close enough - holding steady…</li>` : `<li>Nothing to adjust on this TV; just note the numbers.</li>`)}</ul>
    </div>`;
  bindRestart();
  const nb = $("#c-next");
  if (nb) { nb.disabled = !(d.steady || cfg.cms === "off"); nb.textContent = d.steady ? "Done - next colour" : cfg.cms === "off" ? "Next colour" : "Not on target yet"; }
}
function liveGamut(d, cur) {
  const W = 340, H = 300, u0 = 0.06, u1 = 0.56, v0 = 0.12, v1 = 0.6;
  const X = u => 16 + (u - u0) / (u1 - u0) * (W - 32), Y = v => 8 + (1 - (v - v0) / (v1 - v0)) * (H - 24);
  const prim = { RED: [0.64, 0.33], GREEN: [0.3, 0.6], BLUE: [0.15, 0.06] };
  const p3 = { RED: [0.68, 0.32], GREEN: [0.265, 0.69], BLUE: [0.15, 0.06] };
  const src = S.mode === "sdr" ? prim : p3;
  const tri = ["RED", "GREEN", "BLUE"].map(k => { const u = upvp(src[k]); return `${X(u[0])},${Y(u[1])}`; }).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${COLOUR_NAMES[cur]} against its target">
    <polygon points="${tri}" fill="#ffffff" fill-opacity=".03" stroke="#5a5a5a" stroke-dasharray="4 4"/>
    <circle cx="${X(d.d65_uv[0])}" cy="${Y(d.d65_uv[1])}" r="3" fill="var(--white)"/>
    <circle cx="${X(d.tuv[0])}" cy="${Y(d.tuv[1])}" r="12" fill="none" stroke="var(--white)" stroke-width="2"/>
    <line x1="${X(d.tuv[0])}" y1="${Y(d.tuv[1])}" x2="${X(d.uv[0])}" y2="${Y(d.uv[1])}" stroke="${COLOUR_SW[cur]}" stroke-width="2"/>
    <circle cx="${X(d.uv[0])}" cy="${Y(d.uv[1])}" r="8" fill="${COLOUR_SW[cur]}" stroke="#262626" stroke-width="2"/></svg>`;
}

/* ------------------------------------------------------------------ meter check */
function showCheck() {
  clearInterval(S.poll); stopLive();
  $("#main").innerHTML = `<div class="tvhead"><h1>Check the meter</h1></div>
    <p class="empty" style="margin-top:-8px">Rest the meter on a bright part of the TV. This checks ArgyllCMS, finds the meter and takes three readings.</p>
    <button class="primary" id="runcheck">Run the check</button><ul class="check" id="checkout"></ul>`;
  $("#runcheck").onclick = async () => {
    $("#runcheck").disabled = true; $("#checkout").innerHTML = "<li>Checking…</li>";
    const r = await api("/api/check", {});
    $("#checkout").innerHTML = r.steps.map(s => `<li class="${s.ok ? "okk" : "nok"}">${esc(s.text)}</li>`).join("");
    $("#runcheck").disabled = false;
  };
}

loadTVs().then(loadGuide); loadPhone();
</script>
</body>
